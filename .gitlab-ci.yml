.setup:
  parallel:
    matrix:
      - DISTRO: [debian]
        MPI: [openmpi]
        DEVICE: [cpu, gpu]
        BITS: [32, 64]
  tags:
    - public-docker
  image: $CI_REGISTRY/nexgf/dftbplus/$DISTRO/$MPI-$DEVICE-scalapack$BITS
  variables:
    BUILD_DIR: build-$DISTRO-$MPI-$DEVICE-scalapack$BITS
    MALLOC_CHECK_: 3
    MALLOC_PERTURB_: 1


build:
  extends: .setup
  stage: build
  script:
    - mkdir "$BUILD_DIR"
    - WITH_GPU="$( [ "$DEVICE" = 'gpu' ] && echo ON || echo OFF )"
    - cmake
       -DCMAKE_BUILD_TYPE=Debug
       -DBUILD_SHARED_LIBS:BOOL=ON
       -DBUILD_TESTING=ON
       -DCMAKE_RULE_MESSAGES:BOOL=OFF
       -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
       -DWITH_MPI=ON \
       -DWITH_TRANSPORT=ON
       -DWITH_TRANSPORT_GPU="$WITH_GPU"
       -DSCALAPACK_LIBRARY=scalapack-openmpi
       -DMPIEXEC_MAX_NUMPROCS=8
       -B "$BUILD_DIR"
       -S .
    - num_cpus="$(getconf _NPROCESSORS_ONLN)"
    - echo "Building on $num_cpus CPU cores"
    - cmake --build "$BUILD_DIR" --parallel "$num_cpus"
  artifacts:
    paths:
      - $BUILD_DIR


test:
  extends: .setup
  stage: test
  script:
    - ./utils/get_opt_externals
    - cd "$BUILD_DIR"
    - ctest --output-on-failure -R 'dftb[+]_transport'
